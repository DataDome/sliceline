name: Test

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        numba: [true, false]
        include:
          - numba: true
            extras: --all-extras
          - numba: false
            extras: --extra dev
    name: Python ${{ matrix.python-version }} (Numba=${{ matrix.numba }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: make init EXTRAS="${{ matrix.extras }}"
      - name: Verify Numba availability
        run: |
          uv run python -c "from sliceline import is_numba_available; print(f'Numba available: {is_numba_available()}'); assert str(is_numba_available()).lower() == '${{ matrix.numba }}'"
      - name: Run test
        run: make test
